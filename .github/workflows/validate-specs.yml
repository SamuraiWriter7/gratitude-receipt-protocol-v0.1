name: Validate Specs

on:
  push:
    paths:
      - "gratitude-receipt-protocol-v0.1.yaml"
      - "schemas/**"
      - "examples/**"
      - ".github/workflows/validate-specs.yml"
  pull_request:
    paths:
      - "gratitude-receipt-protocol-v0.1.yaml"
      - "schemas/**"
      - "examples/**"
      - ".github/workflows/validate-specs.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Gratitude Receipt Protocol
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema PyYAML

      - name: Debug file tree
        run: |
          pwd
          find . -maxdepth 4 -type f | sort

      - name: Validate protocol YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          protocol_path = Path("gratitude-receipt-protocol-v0.1.yaml")

          print(f"Loading {protocol_path}...")

          if not protocol_path.exists():
              raise FileNotFoundError(f"Missing required file: {protocol_path}")

          with protocol_path.open("r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          if not isinstance(data, dict):
              raise ValueError("Protocol YAML must parse as a mapping/object.")

          required_top_level_keys = [
              "protocol",
              "metadata",
              "core_principles",
              "receipt_model",
              "validation_rules",
              "minimal_receipt_example",
              "limitations",
              "normative_statement"
          ]

          missing = [key for key in required_top_level_keys if key not in data]

          if missing:
              raise ValueError(f"Protocol YAML is missing required top-level keys: {missing}")

          print("Protocol YAML syntax and top-level structure are valid.")
          PY

      - name: Validate JSON Schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from jsonschema import Draft202012Validator

          schema_path = Path("schemas/gratitude-receipt-v0.1.schema.json")

          print(f"Loading {schema_path}...")

          if not schema_path.exists():
              raise FileNotFoundError(f"Missing required file: {schema_path}")

          with schema_path.open("r", encoding="utf-8") as f:
              schema = json.load(f)

          Draft202012Validator.check_schema(schema)

          print("JSON Schema is valid Draft 2020-12 schema.")
          PY

      - name: Validate sample gratitude receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from jsonschema import Draft202012Validator

          schema_path = Path("schemas/gratitude-receipt-v0.1.schema.json")
          sample_path = Path("examples/gratitude-receipt.sample.json")

          print(f"Loading schema: {schema_path}")
          print(f"Loading sample: {sample_path}")

          if not schema_path.exists():
              raise FileNotFoundError(f"Missing required file: {schema_path}")

          if not sample_path.exists():
              raise FileNotFoundError(f"Missing required file: {sample_path}")

          with schema_path.open("r", encoding="utf-8") as f:
              schema = json.load(f)

          with sample_path.open("r", encoding="utf-8") as f:
              sample = json.load(f)

          validator = Draft202012Validator(schema)
          errors = sorted(validator.iter_errors(sample), key=lambda e: e.path)

          if errors:
              print("Validation failed:")
              for error in errors:
                  path = ".".join(str(part) for part in error.path) or "<root>"
                  print(f"- {path}: {error.message}")
              raise SystemExit(1)

          print("Sample gratitude receipt is valid.")
          PY
